<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - NexDown AI Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B1120;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .opts-card {
      width: 100%;
      max-width: 600px;
      background: #111827;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .opts-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }
    .opts-brand h1 { font-size: 20px; font-weight: 700; }
    .opts-field { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
    .opts-field label { font-size: 13px; font-weight: 600; color: #CBD5E1; }
    .opts-input, .opts-select, .opts-textarea {
      width: 100%;
      background: #1F2937;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #FFFFFF;
      padding: 10px 12px;
      font-size: 13px;
    }
    .opts-input:focus, .opts-select:focus, .opts-textarea:focus {
      outline: none;
      border-color: #8B5CF6;
    }
    .opts-btn {
      width: 100%;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .opts-help { font-size: 12px; color: #94A3B8; }
    .opts-help a { color: #A78BFA; text-decoration: none; }
  </style>
</head>
<body>
  <div class="opts-card">
    <div class="opts-brand">
      <span style="font-size: 28px; background: linear-gradient(135deg,#8B5CF6,#EC4899); border-radius: 8px; padding: 2px 8px;">⚡</span>
      <div>
        <h1>NexDown AI - Configurações</h1>
        <span style="font-size: 12px; color: #94A3B8;">Configure sua Inteligência Artificial para gerar roteiros virais e ganchos sedutores</span>
      </div>
    </div>

    <div class="opts-field">
      <label>Provedor de Inteligência Artificial:</label>
      <select id="opts-provider" class="opts-select">
        <option value="gemini">Google Gemini (Recomendado - Gratuito)</option>
        <option value="groq">Groq (Ultra-Rápido / Llama 3.3 70B)</option>
        <option value="openai">OpenAI (GPT-4o-mini / GPT-4o)</option>
      </select>
    </div>

    <div class="opts-field">
      <label>Chave de API (API Key):</label>
      <input type="password" id="opts-apikey" class="opts-input" placeholder="Cole sua API Key aqui...">
      <span class="opts-help" id="opts-help-link">
        <a href="https://aistudio.google.com/app/apikey" target="_blank">Obter chave gratuita no Google AI Studio ↗</a>
      </span>
    </div>

    <div class="opts-field">
      <label>Modelo:</label>
      <select id="opts-model" class="opts-select">
        <option value="gemini-1.5-flash">gemini-1.5-flash</option>
        <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      </select>
    </div>

    <div class="opts-field">
      <label>Instrução Global de Estilo (Opcional):</label>
      <textarea id="opts-custom-prompt" rows="4" class="opts-textarea" placeholder="Exemplo: 'Meu público é de empreendedores e profissionais liberais. Use sempre tom direto, exemplos práticos de bastidores e termine com um CTA convidativo para comentar.'"></textarea>
    </div>

    <button class="opts-btn" id="opts-save-btn">Salvar Configurações</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
